<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ADMIN SECURITY OVERLAY */
        #security-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        .security-box { width: 100%; max-width: 350px; }
        .sec-step { display: none; animation: fadeIn 0.3s ease; }
        .sec-step.active { display: block; }
        .sec-input {
            width: 100%; padding: 15px; margin: 15px 0;
            border: 2px solid #eee; border-radius: 12px; font-size: 16px; outline: none;
        }
        .sec-input:focus { border-color: #FFB300; }
        .sec-btn {
            background: #FFB300; color: #000; font-weight: bold;
            width: 100%; padding: 15px; border: none; border-radius: 12px; cursor: pointer;
        }
        .error-msg { color: #F44336; font-size: 13px; margin-top: 10px; min-height: 20px; }
        
        /* REST OF ADMIN STYLES */
        .admin-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .order-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #FFF3E0; color: #E65100; }
        .status-delivered { background: #E8F5E9; color: #2E7D32; }
    </style>
</head>
<body>

    <div id="security-overlay">
        <div class="security-box">
            <div style="font-size: 40px; color: #FFB300; margin-bottom: 20px;"><i class="fa-solid fa-user-shield"></i></div>
            
            <div id="step-1" class="sec-step active">
                <h3>Admin Access</h3>
                <p style="color:#666; font-size:14px;">Verify your identity</p>
                <input type="email" id="adminEmail" class="sec-input" placeholder="Enter Admin Gmail">
                <button class="sec-btn" onclick="checkEmail()">Next <i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <div id="step-2" class="sec-step">
                <h3>Password</h3>
                <p style="color:#666; font-size:14px;">Enter security password</p>
                <input type="password" id="adminPass" class="sec-input" placeholder="Password">
                <button class="sec-btn" onclick="checkPass()">Next <i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <div id="step-3" class="sec-step">
                <h3>Secret Code</h3>
                <p style="color:#666; font-size:14px;">Enter the final pin</p>
                <input type="number" id="adminCode" class="sec-input" placeholder="0000">
                <button class="sec-btn" onclick="checkCode()">Login As Admin</button>
            </div>

            <div id="error-display" class="error-msg"></div>
        </div>
    </div>

    <div class="admin-container" id="admin-content" style="display: none;">
        <div class="admin-header">
            <h2>Admin Dashboard</h2>
            <button onclick="location.reload()" style="background:#eee; border:none; padding:10px; border-radius:8px;"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <div id="admin-orders-list">
            <p>Loading orders...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG (Same as script.js)
        const firebaseConfig = {
            apiKey: "AIzaSyBrvdknWfFKdl9Bn8TJRrpWEc2RQDEHZqE",
            authDomain: "eggshop-702f6.firebaseapp.com",
            projectId: "eggshop-702f6",
            storageBucket: "eggshop-702f6.firebasestorage.app",
            messagingSenderId: "290586261198",
            appId: "1:290586261198:web:61cd80463c8c2c5f06429f",
            measurementId: "G-HVJKWCER6S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- SECURITY LOGIC (CHANGE THESE) ---
        const CORRECT_EMAIL = "ashrafsquad001@gmail.com"; // CHANGE THIS
        const CORRECT_PASS = "Ashraf.3691";             // CHANGE THIS
        const CORRECT_CODE = "1357911";                  // CHANGE THIS

        window.checkEmail = () => {
            const email = document.getElementById('adminEmail').value.trim();
            const err = document.getElementById('error-display');
            
            if(email === CORRECT_EMAIL) {
                document.getElementById('step-1').classList.remove('active');
                document.getElementById('step-2').classList.add('active');
                err.innerText = "";
            } else {
                err.innerText = "Gmail is not correct";
                // Don't show password field
            }
        };

        window.checkPass = () => {
            const pass = document.getElementById('adminPass').value;
            const err = document.getElementById('error-display');

            if(pass === CORRECT_PASS) {
                document.getElementById('step-2').classList.remove('active');
                document.getElementById('step-3').classList.add('active');
                err.innerText = "";
            } else {
                err.innerText = "Wrong password";
            }
        };

        window.checkCode = () => {
            const code = document.getElementById('adminCode').value;
            const err = document.getElementById('error-display');

            if(code === CORRECT_CODE) {
                document.getElementById('security-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadOrders(); // Load firebase data only after login
            } else {
                err.innerText = "Invalid Code";
            }
        };

        // --- ADMIN DATA LOGIC ---
        function loadOrders() {
            const list = document.getElementById('admin-orders-list');
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                list.innerHTML = "";
                if(snapshot.empty) { list.innerHTML = "<p>No orders found.</p>"; return; }

                snapshot.forEach(docSnap => {
                    const o = docSnap.data();
                    const id = docSnap.id;
                    const date = o.timestamp ? new Date(o.timestamp.toDate()).toLocaleString() : 'N/A';
                    
                    let statusClass = o.status === 'Delivered' ? 'status-delivered' : 'status-pending';
                    
                    // Logic for Action Buttons
                    let actionButtons = '';
                    if(o.status !== 'Delivered') {
                        actionButtons = `
                         <button onclick="window.markDeliveredForce('${id}')" style="background:#4CAF50; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; margin-right:5px;">
                            <i class="fa-solid fa-check"></i> Delivered
                         </button>
                        `;
                    }

                    list.innerHTML += `
                        <div class="order-card">
                            <div class="admin-header" style="margin-bottom:10px; border-bottom:1px solid #f0f0f0; padding-bottom:10px;">
                                <strong>#${id.substr(0,5)}</strong>
                                <span class="status-badge ${statusClass}">${o.status}</span>
                            </div>
                            <div style="margin-bottom:10px;">
                                <strong>${o.quantity}x ${o.item}</strong><br>
                                <span style="color:#E65100; font-weight:bold;">Total: Ksh ${o.totalPrice}</span>
                                ${o.deliveryCode ? `<br><small style="background:#eee; padding:2px 5px; border-radius:4px;">Code: <b>${o.deliveryCode}</b></small>` : ''}
                            </div>
                            <div style="font-size:12px; color:#666; margin-bottom:10px;">
                                <i class="fa-solid fa-user"></i> ${o.userName || 'User'} <br>
                                <i class="fa-solid fa-location-dot"></i> ${o.address} <br>
                                <i class="fa-solid fa-phone"></i> ${o.mpesaNumber || 'N/A'} <br>
                                <i class="fa-regular fa-clock"></i> ${date}
                            </div>
                            <div style="display:flex; gap:10px;">
                                ${actionButtons}
                                <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address + ', Mombasa')}')" style="background:#E3F2FD; color:#1976D2; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;">
                                    <i class="fa-solid fa-map"></i> Map
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.markDeliveredForce = async (id) => {
            if(confirm("Mark order as delivered?")) {
                await updateDoc(doc(db, "orders", id), { status: 'Delivered' });
            }
        };
    </script>
</body>
</html>
