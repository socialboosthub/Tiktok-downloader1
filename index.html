<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EggMaster Wholesale</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        #stealth-admin-btn {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.05); /* Almost invisible */
            border-radius: 50%;
            z-index: 9999;
            cursor: pointer;
            transition: 0.3s;
        }
        #stealth-admin-btn:hover {
            background: rgba(0,0,0,0.2);
        }
    </style>
    <script type="module" src="script.js" defer></script>
</head>
<body class="not-logged-in">

    <div id="login-overlay" class="login-screen">
        <div class="login-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>
        <div class="login-content">
            <div class="logo-anim">
                <i class="fa-solid fa-egg"></i>
                <div class="yolk-glow"></div>
            </div>
            <h1>EggMaster<span class="dot">.</span></h1>
            <p>Wholesale Supply (Min 30 Trays)</p>
            
            <div class="login-actions">
                <button id="google-login-btn" class="google-btn">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>
            </div>
            
            <div id="stealth-admin-btn" onclick="window.location.href='admin.html'"></div>
        </div>
    </div>

    <section id="home" class="page active">
        <div class="hero">
            <div class="hero-text">
                <h2>Fresh Eggs,<br>Wholesale Prices.</h2>
                <button id="heroOrderBtn" class="cta-btn">Order Now</button>
            </div>
        </div>
    </section>

    <section id="shop" class="page">
        <div class="header-nav">
            <h2>Shop</h2>
        </div>
        <div id="products-list" class="products-grid"></div>
    </section>

    <section id="orders" class="page">
        <div class="header-nav">
            <h2>My Orders</h2>
        </div>
        <div id="orders-list" class="orders-container"></div>
    </section>

    <section id="profile" class="page">
        <div class="header-nav">
            <h2>Profile</h2>
        </div>
        
        <div class="profile-card">
            <div class="avatar-circle">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="profile-info">
                <h3 id="profileName">Loading...</h3>
                <p id="profileEmail">...</p>
            </div>
        </div>

        <div class="settings-list">
            <h4 style="margin: 20px 0 10px; color: #888; font-size: 12px; text-transform: uppercase;">Edit Details</h4>
            
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="editName" placeholder="Enter Name">
            </div>
            <div class="input-group">
                <label>Phone (M-Pesa)</label>
                <input type="tel" id="editPhone" placeholder="07...">
            </div>
            <div class="input-group">
                <label>Delivery Location</label>
                <input type="text" id="editAddress" placeholder="Mombasa...">
            </div>
            <button class="save-btn" onclick="window.saveProfile()">Save Changes</button>

            <h4 style="margin: 30px 0 10px; color: #888; font-size: 12px; text-transform: uppercase;">App Settings</h4>
            
            <div class="setting-item">
                <div class="icon-wrap color-purple"><i class="fa-solid fa-moon"></i></div>
                <div class="text">Dark Mode</div>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle" onchange="window.toggleDarkMode()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="icon-wrap color-green"><i class="fa-solid fa-bell"></i></div>
                <div class="text">Notifications</div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="icon-wrap color-teal"><i class="fa-solid fa-globe"></i></div>
                <div class="text">Language</div>
                <select id="langSelect" class="minimal-select">
                    <option value="en">English</option>
                    <option value="sw">Kiswahili</option>
                </select>
            </div>
        </div>

        <button class="logout-btn" onclick="window.logoutUser()" style="width: 100%; margin-top: 30px; padding: 15px; border-radius: 12px; border: none; background: #FFEBEE; color: #F44336; font-weight: 700;">Logout</button>
        <div style="height: 100px;"></div>
    </section>

    <a href="https://wa.me/254700000000" target="_blank" class="whatsapp-float">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="window.showPage('home', this)"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="window.showPage('shop', this)"><i class="fa-solid fa-bag-shopping"></i></div>
        <div class="nav-item" onclick="window.showPage('orders', this)"><i class="fa-solid fa-receipt"></i></div>
        <div class="nav-item" onclick="window.showPage('profile', this)"><i class="fa-solid fa-user"></i></div>
    </nav>
</body>
</html>
